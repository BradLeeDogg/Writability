appId: com.writability.app
productName: Writability
copyright: Copyright © 2026 Writability

directories:
  buildResources: build
  output: release

# Bundle the built output plus package metadata. Native deps (better-sqlite3)
# are unpacked so the .node binary is loadable from the asar archive.
files:
  - out/**/*
  - package.json
  - "!**/*.map"

asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**

# Don't try to sign / notarize in CI; builds are intentionally unsigned for now.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  # Applies to the zip target. nsis and portable set their own names below so
  # the two .exe outputs don't collide. ${target} is not a valid macro here.
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Writability
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

# macOS: unsigned dmg + zip for both Apple Silicon and Intel. Signing/notarizing
# needs an Apple Developer certificate, which CI doesn't have, so identity is
# forced off; Gatekeeper users right-click → Open the first time.
mac:
  category: public.app-category.education
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  category: Office
  target:
    - AppImage
