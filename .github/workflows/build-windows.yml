name: Build Windows

on:
  push:
    branches:
      - claude/gracious-wozniak-nm9540
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs deps and rebuilds better-sqlite3 for Electron's ABI via the
      # postinstall (electron-builder install-app-deps).
      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build (main / preload / renderer)
        run: npm run build

      - name: Package Windows installers
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: writability-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      # Publish to a rolling "win-latest" release for stable download links.
      - name: Publish to win-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: Writability (latest Windows build)
          body: |
            Automated Windows build from `claude/gracious-wozniak-nm9540`.

            Unsigned build — Windows SmartScreen will warn. Choose
            **More info → Run anyway** to install.

            - **Installer:** `Writability-*-x64-nsis.exe`
            - **Portable:** `Writability-*-portable.exe`
            - **Zip:** `Writability-*-x64-zip.zip`
          files: |
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
